version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - "/RecordValueAnalyser"
      - "/RecordValueAnalyser.CodeFixes"
      - "/RecordValueAnalyser.Roslyn48"
      - "/RecordValueAnalyser.CodeFixes.Roslyn48"
      - "/RecordValueAnalyser.Package"
      - "/RecordValueAnalyser.Test"
      - "/RecordValueAnalyser.Test.Roslyn48"
      - "/RecordValueAnalyser.Test.Roslyn48OnRoslyn59"
      - "/RecordValueAnalyser.Vsix"
      - "/Helpful_collections"
      - "/Helpful_collections.Test"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Each analyser build references the oldest compiler it supports (Roslyn 4.8 and 5.9, matching the
    # package's analyzer folders). Dependabot follows project references, so a per-directory rule cannot
    # protect the 4.8 pins. Roslyn upgrades are manual.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
